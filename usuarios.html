<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitWork | Gestión de Usuarios</title>
    <link rel="stylesheet" href="nav.css">
    <style>
        :root {
            --bg-body: #0d0d0d;
            --panel: #121212;
            --panel-soft: rgba(255,255,255,0.04);
            --accent: #1ed760;
            --accent-hover: #22c55e;
            --text: #ffffff;
            --muted: #9a9a9a;
            --border: rgba(255,255,255,0.08);
            --radius: 18px;
            --shadow: 0 24px 80px rgba(0,0,0,0.45);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg-body);
            color: var(--text);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 16px 100px;
        }
        .header-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.025em;
        }
        .header-greeting {
            color: var(--accent);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        .header-greeting .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: var(--accent);
            color: #0d0d0d;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: var(--accent);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: var(--panel-soft);
            border-color: var(--accent);
        }
        .btn-danger {
            background: rgba(255,77,77,0.15);
            color: #ff4d4d;
            border: 1px solid rgba(255,77,77,0.3);
        }
        .btn-danger:hover {
            background: rgba(255,77,77,0.3);
            color: #fff;
        }
        .grid {
            display: grid;
            gap: 24px;
        }
        @media (min-width: 1024px) {
            .grid {
                grid-template-columns: 380px 1fr;
            }
        }
        .form-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 24px;
            max-height: calc(100vh - 140px);
            overflow-y: auto;
        }
        .form-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-title svg {
            color: var(--accent);
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #111111;
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .form-input:hover {
            border-color: rgba(255,255,255,0.15);
            background: #1a1a1a;
        }
        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(30,215,96,0.15);
            background: #111111;
        }
        .form-input::placeholder {
            color: var(--muted);
            opacity: 0.6;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .form-hint {
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px;
        }
        .form-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 24px;
        }
        .table-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .search-box {
            position: relative;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }
        .search-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #111111;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(30,215,96,0.15);
        }
        .search-icon {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--muted);
            pointer-events: none;
        }
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead {
            background: rgba(255,255,255,0.02);
        }
        th {
            padding: 16px 20px;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-bottom: 1px solid var(--border);
        }
        th.center { text-align: center; }
        th.right { text-align: right; }
        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover {
            background: rgba(30,215,96,0.03);
        }
        td {
            padding: 16px 20px;
            font-size: 14px;
        }
        .user-name {
            font-weight: 700;
            color: var(--text);
        }
        .user-email {
            font-size: 12px;
            color: var(--muted);
            font-style: italic;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .badge-admin {
            background: rgba(168,85,247,0.15);
            color: #a855f7;
        }
        .badge-student {
            background: rgba(30,215,96,0.15);
            color: var(--accent);
        }
        .badge-active {
            background: rgba(30,215,96,0.15);
            color: var(--accent);
        }
        .badge-inactive {
            background: rgba(255,77,77,0.15);
            color: #ff4d4d;
        }
        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .icon-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.04);
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        .icon-btn:hover {
            background: var(--panel-soft);
            border-color: var(--accent);
            color: var(--accent);
        }
        .icon-btn.delete:hover {
            background: rgba(255,77,77,0.15);
            border-color: rgba(255,77,77,0.3);
            color: #ff4d4d;
        }
        .icon-btn svg {
            width: 18px;
            height: 18px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 24px;
            color: var(--muted);
        }
        .hidden { display: none !important; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="container">
    <!-- Header / Nav -->
    <div class="header-card">
        <div>
            <h1 class="header-title">Gestión de Usuarios</h1>
            <p id="user-greeting" class="header-greeting">
                <span class="dot"></span>
                Cargando perfil...
            </p>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <a href="aprobaciones.html" class="btn btn-secondary">✅ Aprobaciones</a>
            <button onclick="logout()" class="btn btn-danger">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Cerrar sesión
            </button>
        </div>
    </div>

    <!-- Main Content Grid -->
    <div class="grid">
        
        <!-- Left Column: Form -->
        <div>
            <form id="form" class="form-card">
                <h3 class="form-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                    </svg>
                    Registro / Edición
                </h3>
                
                <input type="hidden" id="id">
                
                <div class="form-group">
                    <label class="form-label" for="nombre">Nombre Completo</label>
                    <input id="nombre" type="text" placeholder="Ej. Juan Pérez" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="email">Correo Electrónico</label>
                    <input id="email" type="email" placeholder="juan@ejemplo.com" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <input id="password" type="password" placeholder="Mín. 6 caracteres" class="form-input">
                    <p class="form-hint">* Solo necesaria para nuevos registros</p>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="rol">Rol</label>
                        <select id="rol" class="form-input">
                            <option value="">Cargando...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="estado">Estado</label>
                        <select id="estado" class="form-input">
                            <option value="">Cargando...</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Guardar Usuario</button>
                    <button type="button" onclick="limpiarForm()" id="btn-cancelar" class="btn btn-secondary hidden">Cancelar Edición</button>
                </div>
            </form>
        </div>

        <!-- Right Column: Table -->
        <div>
            <!-- Search Bar -->
            <div class="table-card">
                <div class="search-box">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <path d="M21 21l-4.35-4.35" />
                    </svg>
                    <input id="search" onkeyup="filtrar()" placeholder="Buscar por nombre o email..." class="search-input">
                </div>

                <!-- Table Container -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Usuario</th>
                                <th class="center">Rol</th>
                                <th class="center">Estado</th>
                                <th class="right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla">
                            <!-- Rows loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="nav.js"></script>
<nav class="bottom-nav">
    <a href="index.html">🏠 Inicio</a>
    <a href="desafios.html">🎯 Desafíos</a>
    <a href="ranking.html">🏆 Ranking</a>
    <a href="panel.html">👤 Perfil</a>
    <a href="aprobaciones.html">✅ Aprobaciones</a>
    <a href="usuarios.html" class="active">👥 Usuarios</a>
</nav>

<script>
// CONFIGURACIÓN SUPABASE
const SUPABASE_URL = "https://crjtcercspirgzzmzeax.supabase.co";
const SUPABASE_KEY = "sb_publishable_ULR8jNd9FD7W4Khudk0ebw_kCp_R4fM";

const { createClient } = supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

let cache = [];

// VERIFICAR AUTH Y CARGAR GREETING
async function checkAuth() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
        window.location.href = "login.html";
        return false;
    }

    const { data: profile } = await supabaseClient
        .from("usuario")
        .select("nombre, rol (nombre)")
        .eq("auth_id", user.id)
        .single();

    if (!profile || profile.rol?.nombre !== "Administrador") {
        await Swal.fire({
            title: "Acceso restringido",
            text: "Esta sección es solo para administradores.",
            icon: "warning"
        });
        window.location.href = "panel.html";
        return false;
    }

    document.getElementById("user-greeting").innerHTML = `
        <span class="dot"></span>
        Hola, <span style="font-weight:700">${profile.nombre}</span>
    `;
    return true;
}

// CERRAR SESIÓN
async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
}

// CARGAR ROLES
async function getRoles() {
    const select = document.getElementById("rol");
    const { data, error } = await supabaseClient.from("rol").select("*");
    if (error) {
        select.innerHTML = `<option>Error</option>`;
        return;
    }
    select.innerHTML = "";
    data.forEach(r => {
        select.innerHTML += `<option value="${r.id}">${r.nombre}</option>`;
    });
}

// CARGAR ESTADOS
async function getEstados() {
    const select = document.getElementById("estado");
    const { data, error } = await supabaseClient.from("estado").select("*");
    if (error) {
        select.innerHTML = `<option>Error</option>`;
        return;
    }
    select.innerHTML = "";
    data.forEach(e => {
        select.innerHTML += `<option value="${e.id}">${e.nombre}</option>`;
    });
}

// LISTAR USUARIOS
async function getUsuarios() {
    const { data, error } = await supabaseClient
        .from("usuario")
        .select(`*, rol (nombre), estado (nombre)`);

    if (error) {
        Swal.fire("Error", "No se pudieron cargar los datos", "error");
        return;
    }
    cache = data;
    render(data);
}

// PINTAR TABLA
function render(data) {
    const tabla = document.getElementById("tabla");
    tabla.innerHTML = "";
    
    if (data.length === 0) {
        tabla.innerHTML = `<tr><td colspan="4" class="empty-state">No se encontraron usuarios...</td></tr>`;
        return;
    }

    data.forEach((u, index) => {
        const tr = document.createElement("tr");
        
        const rolClass = u.rol?.nombre === 'Administrador' ? 'badge-admin' : 'badge-student';
        const estadoClass = u.estado?.nombre === 'Activo' ? 'badge-active' : 'badge-inactive';

        tr.innerHTML = `
            <td>
                <div>
                    <span class="user-name">${u.nombre || 'Sin nombre'}</span>
                    <br>
                    <span class="user-email">${u.email}</span>
                </div>
            </td>
            <td class="center">
                <span class="badge ${rolClass}">${u.rol?.nombre || "N/A"}</span>
            </td>
            <td class="center">
                <span class="badge ${estadoClass}">${u.estado?.nombre || "N/A"}</span>
            </td>
            <td class="right">
                <div class="actions">
                    <button onclick="editarBtnClick(${index})" title="Editar" class="icon-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                    </button>
                    <button onclick="eliminar('${u.id}')" title="Eliminar" class="icon-btn delete">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                </div>
            </td>
        `;
        tabla.appendChild(tr);
    });
}

// GUARDAR / ACTUALIZAR
document.getElementById("form").onsubmit = async (e) => {
    e.preventDefault();
    
    const data = {
        nombre: document.getElementById("nombre").value,
        email: document.getElementById("email").value,
        rol_id: document.getElementById("rol").value,
        estado_id: document.getElementById("estado").value
    };
    
    const password = document.getElementById("password").value;
    const id = document.getElementById("id").value;
    
    Swal.fire({ title: 'Procesando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

    let error;

    if (id) {
        ({ error } = await supabaseClient.from("usuario").update(data).eq("id", id));
    } else {
        if (!password) {
            Swal.fire("Error", "La contraseña es obligatoria para nuevos usuarios", "error");
            return;
        }
        
        const { data: authData, error: authError } = await supabaseClient.auth.signUp({
            email: data.email,
            password: password
        });

        if (authError) {
            Swal.fire("Error Auth", authError.message, "error");
            return;
        }

        data.auth_id = authData.user.id;
        ({ error } = await supabaseClient.from("usuario").insert([data]));
    }

    if (error) {
        Swal.fire("Error", error.message, "error");
        return;
    }

    limpiarForm();
    getUsuarios();
    Swal.fire("¡Listo!", "Información guardada con éxito", "success");
};

// BOTÓN EDITAR EN TABLA
function editarBtnClick(index) {
    const u = cache[index];
    document.getElementById("id").value = u.id;
    document.getElementById("nombre").value = u.nombre;
    document.getElementById("email").value = u.email;
    document.getElementById("rol").value = u.rol_id;
    document.getElementById("estado").value = u.estado_id;
    
    document.getElementById("btn-cancelar").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// LIMPIAR FORM
function limpiarForm() {
    document.getElementById("form").reset();
    document.getElementById("id").value = "";
    document.getElementById("btn-cancelar").classList.add("hidden");
}

// ELIMINAR
async function eliminar(id) {
    const res = await Swal.fire({
        title: '¿Confirmas la eliminación?',
        text: "Esta acción no se puede deshacer",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#1ed760',
        cancelButtonColor: '#ff4d4d',
        confirmButtonText: 'Sí, borrar',
        cancelButtonText: 'No, cancelar'
    });

    if (res.isConfirmed) {
        const { error } = await supabaseClient.from("usuario").delete().eq("id", id);
        if (error) {
            Swal.fire("Error", error.message, "error");
            return;
        }
        getUsuarios();
        Swal.fire('Borrado', 'El usuario ha sido eliminado.', 'success');
    }
}

// FILTRAR
function filtrar() {
    const q = document.getElementById("search").value.toLowerCase();
    const f = cache.filter(u =>
        u.nombre.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)
    );
    render(f);
}

// INICIALIZACIÓN
window.onload = async () => {
    const esAdmin = await checkAuth();
    if (!esAdmin) return;
    Promise.allSettled([getRoles(), getEstados(), getUsuarios()]);
};
</script>
</body>
</html>
