<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="./dist/styles.css">
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .bg-gradient-to-br { background-image: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); }
        .from-indigo-500, .to-purple-600 { background: transparent; }
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .h-screen { min-height: 100vh; }
        .bg-white { background-color: #ffffff; }
        .p-8 { padding: 2rem; }
        .rounded-2xl { border-radius: 1rem; }
        .shadow-2xl { box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15); }
        .w-96 { width: 24rem; max-width: 100%; }
        .transform { transform: translateZ(0); }
        .transition-all { transition: all 0.2s ease; }
        .hover\:scale-105:hover { transform: scale(1.05); }
        .text-3xl { font-size: 1.875rem; line-height: 2.25rem; font-weight: 800; }
        .font-extrabold { font-weight: 800; }
        .mb-6 { margin-bottom: 1.5rem; }
        .text-center { text-align: center; }
        .text-gray-800 { color: #1f2937; }
        .space-y-4 > * + * { margin-top: 1rem; }
        .block { display: block; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .font-medium { font-weight: 500; }
        .text-gray-700 { color: #374151; }
        .mb-1 { margin-bottom: 0.25rem; }
        .w-full { width: 100%; }
        .p-3 { padding: 0.75rem; }
        .border { border-width: 1px; border-style: solid; border-color: #d1d5db; }
        .border-gray-300 { border-color: #d1d5db; }
        .rounded-lg { border-radius: 0.5rem; }
        .outline-none { outline: none; }
        .bg-indigo-600 { background-color: #4f46e5; }
        .hover\:bg-indigo-700:hover { background-color: #4338ca; }
        .text-white { color: #ffffff; }
        .font-bold { font-weight: 700; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .rounded-lg { border-radius: 0.5rem; }
        .shadow-lg { box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1); }
        .hover\:shadow-indigo-500\/50:hover { box-shadow: 0 10px 15px rgba(99, 102, 241, 0.5); }
        .duration-300 { transition-duration: 300ms; }
        .mt-2 { margin-top: 0.5rem; }
        .relative { position: relative; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .items-center { align-items: center; }
        .flex-grow { flex-grow: 1; }
        .border-t { border-top-width: 1px; }
        .border-gray-300 { border-color: #d1d5db; }
        .flex-shrink { flex-shrink: 1; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .text-gray-400 { color: #9ca3af; }
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .uppercase { text-transform: uppercase; }
        .bg-white { background-color: #ffffff; }
        .border-2 { border-width: 2px; }
        .border-green-600 { border-color: #16a34a; }
        .text-green-600 { color: #16a34a; }
        .hover\:bg-green-50:hover { background-color: #ecfdf5; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-2xl shadow-2xl w-96 transform transition-all hover:scale-105">
    <h2 class="text-3xl font-extrabold mb-6 text-center text-gray-800">Bienvenido</h2>

    <form id="login-form" onsubmit="login(event)" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
            <input id="email" type="email" placeholder="correo@ejemplo.com"
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input id="password" type="password" placeholder="••••••••"
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all">
        </div>

        <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow-lg hover:shadow-indigo-500/50 transition-all duration-300 mt-2">
            Iniciar Sesión
        </button>

        <div class="relative flex py-3 items-center">
            <div class="flex-grow border-t border-gray-300"></div>
            <span class="flex-shrink mx-4 text-gray-400 text-xs uppercase">O</span>
            <div class="flex-grow border-t border-gray-300"></div>
        </div>

        <button type="button" onclick="window.location.href='registro.html'"
            class="w-full bg-white border-2 border-green-600 text-green-600 hover:bg-green-50 font-bold py-3 rounded-lg transition-all duration-300">
            Crear Cuenta Nueva
        </button>
    </form>
</div>

<script>
const SUPABASE_URL = "https://crjtcercspirgzzmzeax.supabase.co";
const SUPABASE_KEY = "sb_publishable_ULR8jNd9FD7W4Khudk0ebw_kCp_R4fM";

const { createClient } = supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

async function redirectIfAuthenticated() {
    const { data: { user }, error } = await supabaseClient.auth.getUser();
    if (!error && user) {
        window.location.href = "panel.html";
    }
}

async function login(e) {
    if (e) e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        Swal.fire("Atención", "Por favor ingresa tu correo y contraseña para continuar.", "warning");
        return;
    }

    Swal.fire({
        title: 'Verificando credenciales...',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
    });

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
        const message = error.message.includes("Invalid login") || error.message.includes("Invalid")
            ? "Correo o contraseña incorrectos. Verifica tus datos e intenta nuevamente."
            : error.message;
        Swal.fire("Error de acceso", message, "error");
        return;
    }

    if (!data.user) {
        Swal.fire("Error de acceso", "No se pudo iniciar sesión. Intenta de nuevo.", "error");
        return;
    }

    Swal.fire({
        title: "¡Bienvenido!",
        text: "Ingresando al panel principal...",
        icon: "success",
        timer: 1000,
        showConfirmButton: false
    }).then(() => {
        window.location.href = "panel.html";
    });
}

window.addEventListener("load", redirectIfAuthenticated);
</script>

</body>
</html>
