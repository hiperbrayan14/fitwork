<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" href="./dist/styles.css">
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .bg-gradient-to-br { background-image: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); }
        .from-indigo-500 { --tw-gradient-from: #6366f1; }
        .to-purple-600 { --tw-gradient-to: #8b5cf6; }
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .h-screen { min-height: 100vh; }
        .bg-white { background-color: #ffffff; }
        .p-8 { padding: 2rem; }
        .rounded-2xl { border-radius: 1rem; }
        .shadow-2xl { box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15); }
        .w-96 { width: 24rem; max-width: 100%; }
        .transform { transform: translateZ(0); }
        .transition-all { transition: all 0.2s ease; }
        .hover\:scale-105:hover { transform: scale(1.05); }
        .text-3xl { font-size: 1.875rem; line-height: 2.25rem; font-weight: 800; }
        .font-extrabold { font-weight: 800; }
        .mb-6 { margin-bottom: 1.5rem; }
        .text-center { text-align: center; }
        .text-gray-800 { color: #1f2937; }
        .space-y-4 > * + * { margin-top: 1rem; }
        .block { display: block; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .font-medium { font-weight: 500; }
        .text-gray-700 { color: #374151; }
        .mb-1 { margin-bottom: 0.25rem; }
        .w-full { width: 100%; }
        .p-3 { padding: 0.75rem; }
        .border { border-width: 1px; border-style: solid; border-color: #d1d5db; }
        .border-gray-300 { border-color: #d1d5db; }
        .rounded-lg { border-radius: 0.5rem; }
        .focus\:ring-2:focus { box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.5); }
        .focus\:border-transparent:focus { border-color: transparent; }
        .outline-none { outline: none; }
        .bg-indigo-600 { background-color: #4f46e5; }
        .hover\:bg-indigo-700:hover { background-color: #4338ca; }
        .text-white { color: #ffffff; }
        .font-bold { font-weight: 700; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .shadow-lg { box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1); }
        .hover\:shadow-indigo-500\/50:hover { box-shadow: 0 10px 15px rgba(99, 102, 241, 0.5); }
        .duration-300 { transition-duration: 300ms; }
        .mt-2 { margin-top: 0.5rem; }
        .text-indigo-600 { color: #2563eb; }
        .hover\:text-indigo-800:hover { color: #312e81; }
        .mt-4 { margin-top: 1rem; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-2xl shadow-2xl w-96 transform transition-all hover:scale-105">
    <h2 class="text-3xl font-extrabold mb-6 text-center text-gray-800">Crear Cuenta</h2>

    <div class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
            <input id="nombre" type="text" placeholder="Tu nombre"
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
            <input id="email" type="email" placeholder="correo@ejemplo.com"
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input id="password" type="password" placeholder="••••••••"
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all">
        </div>

        <button onclick="register()"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow-lg hover:shadow-indigo-500/50 transition-all duration-300 mt-2">
            Registrarse
        </button>

        <div class="text-center mt-4">
            <a href="login.html" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = "https://crjtcercspirgzzmzeax.supabase.co";
const SUPABASE_KEY = "sb_publishable_ULR8jNd9FD7W4Khudk0ebw_kCp_R4fM";

const { createClient } = supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

async function register() {
    const btn = document.querySelector('button[onclick="register()"]');
    const nombre = document.getElementById("nombre").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!nombre || !email || !password) {
        Swal.fire("Atención", "Todos los campos son obligatorios.", "warning");
        return;
    }

    if (password.length < 6) {
        Swal.fire("Atención", "La contraseña debe tener al menos 6 caracteres.", "warning");
        return;
    }

    if (btn) btn.disabled = true;

    Swal.fire({
        title: 'Creando tu cuenta...',
        text: 'Por favor espera un momento',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
    });

    try {
        const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
                data: {
                    full_name: nombre,
                    nombre: nombre,
                    points: 0,
                    completed_challenges: [],
                    progress: 0,
                    role: "Estudiante"
                }
            }
        });

        if (signUpError) throw signUpError;

        const user = signUpData.user;
        if (!user) {
            throw new Error("No se pudo crear el usuario. Intenta nuevamente.");
        }

        

        const profileData = {
            auth_id: user.id,
            nombre,
            email
        };

        try {
            const { data: rolData, error: rolError } = await supabaseClient
                .from("rol")
                .select("id")
                .eq("nombre", "Estudiante")
                .maybeSingle();

            if (!rolError && rolData?.id) {
                profileData.rol_id = rolData.id;
            }
        } catch (rolErr) {
            console.warn("No se pudo cargar el rol predeterminado", rolErr);
        }

        try {
            const { data: estadoData, error: estadoError } = await supabaseClient
                .from("estado")
                .select("id")
                .eq("nombre", "Activo")
                .maybeSingle();

            if (!estadoError && estadoData?.id) {
                profileData.estado_id = estadoData.id;
            }
        } catch (estadoErr) {
            console.warn("No se pudo cargar el estado predeterminado", estadoErr);
        }

        await supabaseClient.from("usuario").insert([profileData]);

        const { data: loginData, error: loginError } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (loginError) throw loginError;

        Swal.fire({
            title: "¡Cuenta creada!",
            text: "Tu perfil quedó listo y ya puedes entrar al panel principal.",
            icon: "success"
        }).then(() => {
            window.location.href = "panel.html";
        });

    } catch (error) {
        const msg = (error?.message || "").toLowerCase();
        if (msg.includes("rate limit") || msg.includes("too many")) {
            Swal.fire("Demasiados intentos", "Has superado el límite de registros permitidos. Espera unos minutos e inténtalo de nuevo.", "error");
        } else {
            Swal.fire("Error al registrar", error?.message || "No se pudo completar el registro.", "error");
        }
    } finally {
        if (btn) btn.disabled = false;
    }
}
</script>

</body>
</html>
