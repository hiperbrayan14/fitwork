<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login – FitWork</title>
  <link rel="stylesheet" href="./dist/styles.css">

  <style>
    /* ---------- variables del tema oscuro (igual que en desafios.html) ---------- */
    :root{
      --bg-body:#0d0d0d;
      --panel:#121212;
      --panel-soft:rgba(255,255,255,.04);
      --accent:#2e9e5b;
      --accent-hover:#247a46;
      --text:#ffffff;
      --muted:#9a9a9a;
      --border:rgba(255,255,255,.08);
      --radius:20px;
      --shadow:0 24px 80px rgba(0,0,0,.45);
    }

    /* ---------- reset básico ---------- */
    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg-body);
      color:var(--text);
      min-height:100vh;
      min-height:100dvh;                 /* altura real en móviles con barra de navegación */
      display:flex;
      align-items:center;
      justify-content:center;
      padding:1.5rem;                    /* 24 px a los lados en móvil */
      position:relative;
      overflow-x:hidden;                 /* evita scroll horizontal */
    }

    /* ---------- fondo animado (canvas) ---------- */
    #bg-canvas{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      width:100%;
      height:100%;
    }

    /* gradientes decorativos + grid sutil (igual que antes) */
    body::before{
      content:'';
      position:fixed;
      inset:0;
      background:
        radial-gradient(ellipse 90% 60% at 50% -10%,rgba(46,158,91,.15),transparent 60%),
        radial-gradient(ellipse 60% 40% at 100% 100%,rgba(46,158,91,.08),transparent 50%),
        radial-gradient(ellipse 50% 50% at 0% 0%,rgba(46,158,91,.06),transparent 45%),
        linear-gradient(180deg,rgba(255,255,255,.015) 0%,transparent 40%,rgba(0,0,0,.3) 100%);
      pointer-events:none;
      z-index:0;
    }
    body::after{
      content:'';
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
      background-size:60px 60px;
      opacity:.4;
      pointer-events:none;
      z-index:0;
      mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 30%,transparent 70%);
    }

    /* ---------- tarjeta de login ---------- */
    .card{
      position:relative;
      z-index:1;
      background:rgba(17,17,17,.9);
      backdrop-filter:blur(20px);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow),0 0 0 1px rgba(46,158,91,.05) inset;
      width:100%;
      max-width:28rem;               /* 448 px en escritorio */
      padding:2.5rem;
      animation:slideUp .6s cubic-bezier(.16,1,.3,1);
    }
    @keyframes slideUp{
      from{opacity:0;transform:translateY(24px);}
      to{opacity:1;transform:translateY(0);}
    }

    /* ---------- elementos internos ---------- */
    .brand{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:56px;height:56px;
      border-radius:16px;
      background:linear-gradient(135deg,rgba(46,158,91,.15),rgba(46,158,91,.05));
      border:1px solid rgba(46,158,91,.2);
      color:var(--accent);
      font-weight:800;font-size:22px;letter-spacing:.04em;
      margin:0 auto 1.5rem;
    }
    .title{
      font-size:1.75rem;line-height:1.2;font-weight:800;text-align:center;
      margin-bottom:.5rem;
      background:linear-gradient(180deg,#fff,var(--muted));
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .subtitle{text-align:center;color:var(--muted);font-size:.95rem;margin-bottom:2rem;line-height:1.5;}

    .space-y-4 > * + *{margin-top:1rem;}
    .label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.08em;}
    .input-wrapper{position:relative;}
    .input{
      width:100%;padding:.875rem 1rem;
      border:1px solid var(--border);
      border-radius:12px;
      background:#161616;color:var(--text);
      outline:none;transition:border-color .2s,box-shadow .2s,background .2s;
      font-size:1rem;                         /* ≥16 px en móvil, evita zoom en iOS */
    }
    .input:hover{border-color:rgba(255,255,255,.15);background:#1a1a1a;}
    .input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,158,91,.15);background:#161616;}
    .input::placeholder{color:var(--muted);opacity:.6;}

    .btn{
      width:100%;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
      padding:.875rem 1.5rem;border-radius:12px;
      font-weight:700;font-size:1rem;border:none;cursor:pointer;
      transition:background .2s,transform .2s,box-shadow .2s;
      min-height:44px;                        /* área táctil mínima */
    }
    .btn-primary{
      background:linear-gradient(180deg,var(--accent),#16b852);
      color:#0d0d0d;box-shadow:0 4px 20px rgba(46,158,91,.25);
    }
    .btn-primary:hover{background:linear-gradient(180deg,var(--accent-hover),#1aa34a);transform:translateY(-2px);box-shadow:0 8px 30px rgba(46,158,91,.35);}
    .btn-primary:active{transform:translateY(0);}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none;}
    .btn-secondary{
      background:rgba(255,255,255,.04);color:var(--accent);
      border:1px solid rgba(46,158,91,.3);
    }
    .btn-secondary:hover{background:rgba(46,158,91,.1);border-color:var(--accent);}

    .divider{display:flex;align-items:center;gap:1rem;margin:1.25rem 0;}
    .divider > span{flex:1;height:1px;background:var(--border);}
    .divider-text{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;}

    .footer-note{text-align:center;margin-top:1.5rem;color:var(--muted);font-size:.8rem;}
    .footer-note a{color:var(--accent);text-decoration:none;font-weight:600;}
    .footer-note a:hover{text-decoration:underline;}

    /* ---------- botón “Inicio” ---------- */
    .back-home{
      position:fixed;top:1rem;left:1rem;z-index:10;
      color:var(--muted);text-decoration:none;
      font-size:.85rem;font-weight:500;
      padding:.5rem .75rem;border-radius:8px;
      background:rgba(255,255,255,.04);border:1px solid var(--border);
      transition:all .2s;
    }
    .back-home:hover{color:var(--accent);border-color:rgba(46,158,91,.4);background:rgba(46,158,91,.08);}

    /* ---------- estados de error ---------- */
    .input-error{border-color:#ff4d4d !important;}
    .error-msg{display:none;color:#ff6b6b;font-size:.75rem;margin-top:.35rem;}
    .error-msg.visible{display:block;animation:shake .3s ease;}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

    /* ---------- responsive ---------- */
    @media (max-width:480px){
      body{padding:1rem;align-items:flex-start;padding-top:5rem;}   /* espacio para botón “Inicio” */
      .card{padding:1.5rem;border-radius:16px;}
      .brand{width:48px;height:48px;font-size:18px;margin-bottom:1rem;}
      .title{font-size:1.5rem;}
      .subtitle{font-size:.9rem;margin-bottom:1.5rem;}
      .label{font-size:.7rem;}
      .input{padding:.75rem .875rem;font-size:1rem;border-radius:10px;}
      .btn{padding:.75rem 1.25rem;font-size:.95rem;border-radius:10px;}
      .divider{margin:1rem 0;}
      .divider-text{font-size:.65rem;}
      .footer-note{font-size:.75rem;margin-top:1rem;}
      .back-home{top:.75rem;left:.75rem;padding:.4rem .6rem;font-size:.75rem;border-radius:6px;}
      .error-msg{font-size:.7rem;}
    }
    @media (max-width:360px){
      .card{padding:1.25rem;}
      .title{font-size:1.35rem;}
      .btn{padding:.7rem 1rem;font-size:.9rem;}
    }
    @media (min-width:768px){
      .card{padding:2.5rem;}
    }
    @media (prefers-reduced-motion:reduce){
      .card{animation:none;}
      #bg-canvas{display:none;}
      body::after{display:none;}
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <canvas id="bg-canvas"></canvas>

  <a href="index.html" class="back-home" aria-label="Volver al inicio">← Inicio</a>

  <div class="card">
    <div class="brand">FW</div>
    <h2 class="title">Bienvenido</h2>
    <p class="subtitle">Inicia sesión para acceder a tu panel y continuar tus retos.</p>

    <form id="login-form" onsubmit="login(event)" class="space-y-4" novalidate>
      <div>
        <label class="label" for="email">Correo</label>
        <div class="input-wrapper">
          <input id="email" type="email" placeholder="correo@ejemplo.com" class="input" autocomplete="email" required>
          <p class="error-msg" id="email-error">Ingresa un correo válido</p>
        </div>
      </div>

      <div>
        <label class="label" for="password">Contraseña</label>
        <div class="input-wrapper">
          <input id="password" type="password" placeholder="••••••••" class="input" autocomplete="current-password" required minlength="6">
          <p class="error-msg" id="password-error">Mínimo 6 caracteres</p>
        </div>
      </div>

      <button type="submit" class="btn btn-primary mt-2">Iniciar Sesión</button>

      <div class="divider"><span></span><span class="divider-text">O</span><span></span></div>

      <button type="button" onclick="window.location.href='registro.html'" class="btn btn-secondary">Crear Cuenta Nueva</button>
    </form>

    <p class="footer-note">¿Olvidaste tu contraseña? <a href="#">Recuperar acceso</a></p>
  </div>

  <script>
    const SUPABASE_URL = "https://crjtcercspirgzzmzeax.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ULR8jNd9FD7W4Khudk0ebw_kCp_R4fM";

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    const emailInput    = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const emailError    = document.getElementById("email-error");
    const passwordError = document.getElementById("password-error");
    const submitBtn     = document.querySelector(".btn-primary");

    function showError(input,errorEl){input.classList.add("input-error");errorEl.classList.add("visible");}
    function clearError(input,errorEl){input.classList.remove("input-error");errorEl.classList.remove("visible");}
    // Lista blanca de dominios institucionales permitidos
    const INSTITUTIONAL_DOMAINS = [
      // México - Universidades públicas
      'unam.mx', 'ipn.mx', 'uanl.mx', 'udg.mx', 'uam.mx', 'uach.mx', 'uabc.mx',
      'uas.mx', 'uaem.mx', 'uaq.mx', 'uaz.mx', 'ubuap.mx', 'ucol.mx', 'uceh.mx',
      'udem.mx', 'udlap.mx', 'ugto.mx', 'uh.mx', 'uia.mx', 'ujat.mx', 'ujed.mx',
      'ulsa.mx', 'umich.mx', 'unach.mx', 'unacar.mx', 'unad.mx', 'unam.mx',
      'unison.mx', 'upemor.mx', 'upn.mx', 'uqroo.mx', 'ur.mx', 'us.mx', 'usaem.mx',
      'usac.mx', 'usb.mx', 'usfx.mx', 'uson.mx', 'ut.mx', 'utc.mx', 'utcj.mx',
      'uteq.mx', 'utg.mx', 'uth.mx', 'utm.mx', 'utne.mx', 'utp.mx', 'uts.mx',
      'utt.mx', 'utu.mx', 'utv.mx', 'uv.mx', 'uvm.mx', 'ux.mx',
      // México - Tecnológicos e institutos
      'itesm.mx', 'ite.edu.mx', 'itm.mx', 'itt.mx', 'itver.mx', 'itz.mx',
      // Dominios educativos genéricos México
      'edu.mx', 'sep.gob.mx',
      // Colombia
      'unal.edu.co', 'javeriana.edu.co', 'universidad.edu.co', 'eafit.edu.co',
      'udea.edu.co', 'udes.edu.co', 'uninorte.edu.co', 'usb.edu.co',
      'iemab.edu.co',
      'edu.co', 'gov.co',
      // Perú
      'unmsm.edu.pe', 'pucp.edu.pe', 'upc.edu.pe', 'ulima.edu.pe',
      'edu.pe', 'gob.pe',
      // Argentina
      'uba.ar', 'unlp.edu.ar', 'unc.edu.ar', 'utn.edu.ar',
      'edu.ar', 'gob.ar',
      // Chile
      'uchile.cl', 'uc.cl', 'usach.cl', 'uv.cl',
      'edu.cl', 'gob.cl',
      // España
      'upm.es', 'ucm.es', 'uam.es', 'us.es', 'uv.es',
      'edu.es', 'gob.es',
      // Genéricos internacionales
      'edu', 'gov', 'gob', 'ac.uk', 'edu.au', 'ac.nz'
    ];

    function isInstitutionalEmail(email) {
      const domain = email.split('@')[1]?.toLowerCase();
      if (!domain) return false;
      // Verificar coincidencia exacta o subdominio
      return INSTITUTIONAL_DOMAINS.some(instDomain => 
        domain === instDomain || domain.endsWith('.' + instDomain)
      );
    }

    function validateEmail(e){
      const basicRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return basicRegex.test(e) || isInstitutionalEmail(e);
    }

    emailInput.addEventListener("input",()=>clearError(emailInput,emailError));
    passwordInput.addEventListener("input",()=>clearError(passwordInput,passwordError));

    async function redirectIfAuthenticated(){
      const {data:{user},error}=await supabaseClient.auth.getUser();
      if(!error&&user) window.location.href="panel.html";
    }

    async function login(e){
      e.preventDefault();
      let ok=true;
      const email=emailInput.value.trim();
      const password=passwordInput.value;

      if(!email||!validateEmail(email)){showError(emailInput,emailError);ok=false;}
      if(!password||password.length<6){showError(passwordInput,passwordError);ok=false;}
      if(!ok) return;

      submitBtn.disabled=true;submitBtn.textContent="Entrando…";

      Swal.fire({title:'Verificando credenciales…',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});

      const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});

      if(error){
        submitBtn.disabled=false;submitBtn.textContent="Iniciar Sesión";
        const msg=error.message.includes("Invalid login")||error.message.includes("Invalid")
          ?"Correo o contraseña incorrectos. Verifica tus datos e intenta nuevamente."
          :error.message;
        Swal.fire("Error de acceso",msg,"error");
        return;
      }
      if(!data.user){
        submitBtn.disabled=false;submitBtn.textContent="Iniciar Sesión";
        Swal.fire("Error de acceso","No se pudo iniciar sesión. Intenta de nuevo.","error");
        return;
      }

      Swal.fire({title:"¡Bienvenido!",text:"Ingresando al panel principal…",icon:"success",timer:1000,showConfirmButton:false})
        .then(()=>window.location.href="panel.html");
    }

    /* ---------- canvas background animation ---------- */
    const canvas=document.getElementById("bg-canvas");
    const ctx=canvas.getContext("2d");
    let particles=[],W=0,H=0;

    function resize(){
      W=canvas.width=window.innerWidth;
      H=canvas.height=window.innerHeight;
    }
    window.addEventListener("resize",resize);
    resize();

    class Particle{
      constructor(){this.reset();}
      reset(){
        this.x=Math.random()*W;
        this.y=Math.random()*H;
        this.r=Math.random()*1.5+0.5;
        this.vx=(Math.random()-.5)*.3;
        this.vy=(Math.random()-.5)*.3;
        this.alpha=Math.random()*.3+.1;
      }
      update(){
        this.x+=this.vx;this.y+=this.vy;
        if(this.x<-10||this.x>W+10||this.y<-10||this.y>H+10)this.reset();
      }
      draw(){
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(46,158,91,${this.alpha})`;
        ctx.fill();
      }
    }

    for(let i=0;i<60;i++)particles.push(new Particle());

    function animate(){
      ctx.clearRect(0,0,W,H);
      particles.forEach(p=>{p.update();p.draw();});
      for(let i=0;i<particles.length;i++){
        for(let j=i+1;j<particles.length;j++){
          const dx=particles[i].x-particles[j].x;
          const dy=particles[i].y-particles[j].y;
          const d=Math.hypot(dx,dy);
          if(d<120){
            ctx.beginPath();
            ctx.moveTo(particles[i].x,particles[i].y);
            ctx.lineTo(particles[j].x,particles[j].y);
            ctx.strokeStyle=`rgba(46,158,91,${0.03*(1-d/120)})`;
            ctx.lineWidth=.5;ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener("load",redirectIfAuthenticated);
  </script>
</body>
</html>
