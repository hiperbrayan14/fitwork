<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit Work | Ranking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --accent-green: #00e676;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #2d2d2d;
            --radius: 15px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background-color: var(--bg-dark); color: var(--text-primary); min-height: 100vh; padding-bottom: 120px; }
        .container { max-width: 960px; margin: 0 auto; padding: 24px 18px 0; }
        .badge { display: inline-flex; align-items: center; gap: 8px; background-color: rgba(0, 230, 118, 0.12); color: var(--accent-green); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; margin-bottom: 18px; }
        .page-title { font-size: 30px; font-weight: 800; line-height: 1.1; margin-bottom: 12px; }
        .page-copy { color: var(--text-secondary); font-size: 15px; line-height: 1.7; max-width: 720px; margin-bottom: 24px; }
        .leaderboard-card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); overflow: hidden; }
        .leaderboard-row { display: grid; grid-template-columns: 1fr 3fr 1fr; gap: 16px; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        .leaderboard-row.header { background-color: rgba(0, 230, 118, 0.05); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
        .leaderboard-row:last-child { border-bottom: none; }
        .leaderboard-rank { color: var(--accent-green); font-weight: 700; }
        .leaderboard-row.me { background-color: rgba(0, 230, 118, 0.08); }
        .leaderboard-row.me .leaderboard-rank { color: #ffffff; }
        .empty-state { padding: 30px 20px; color: var(--text-secondary); text-align: center; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background-color: rgba(18, 18, 18, 0.98); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; gap: 10px; padding: 12px 16px; z-index: 50; }
        .bottom-nav a { color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 700; padding: 10px 14px; border-radius: 15px; background-color: rgba(255, 255, 255, 0.04); transition: all 0.2s ease; }
        .bottom-nav a:hover, .bottom-nav a.active { color: #ffffff; background-color: rgba(0, 230, 118, 0.14); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
    <div class="container">
        <span class="badge">🏆 Ranking</span>
        <h1 class="page-title">Tabla de posiciones</h1>
        <p class="page-copy">Top de estudiantes con más puntos por actividades completadas en Fit Work.</p>

        <div class="leaderboard-card">
            <div class="leaderboard-row header">
                <span>Posición</span>
                <span>Estudiante</span>
                <span>Puntos</span>
            </div>
            <div id="leaderboard-body">
                <div class="empty-state">Cargando ranking...</div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html">🏠 Inicio</a>
        <a href="desafios.html">🎯 Desafíos</a>
        <a href="ranking.html" class="active">🏆 Ranking</a>
        <a href="panel.html">👤 Perfil</a>
    </nav>

    <script>
        const SUPABASE_URL = "https://crjtcercspirgzzmzeax.supabase.co";
        const SUPABASE_KEY = "sb_publishable_ULR8jNd9FD7W4Khudk0ebw_kCp_R4fM";
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        async function ensureSession() {
            const { data: { user }, error } = await supabaseClient.auth.getUser();
            if (error || !user) {
                window.location.href = "login.html";
                return null;
            }
            return user;
        }

        async function loadRanking(currentUser) {
            const body = document.getElementById("leaderboard-body");

            const { data, error } = await supabaseClient
                .from("usuario")
                .select("nombre, email, puntos, auth_id")
                .order("puntos", { ascending: false })
                .limit(20);

            if (error || !data || !data.length) {
                body.innerHTML = '<div class="empty-state">Aún no hay estudiantes con puntos. ¡Sé el primero en completar un reto!</div>';
                return;
            }

            body.innerHTML = data.map((row, index) => {
                const nombre = row.nombre || row.email || "Estudiante";
                const isMe = row.auth_id === currentUser.id;
                return `
                    <div class="leaderboard-row${isMe ? " me" : ""}">
                        <span class="leaderboard-rank">${index + 1}</span>
                        <span>${nombre}${isMe ? " (Tú)" : ""}</span>
                        <span>${row.puntos ?? 0} pts</span>
                    </div>
                `;
            }).join("");
        }

        window.addEventListener("load", async () => {
            const user = await ensureSession();
            if (!user) return;
            await loadRanking(user);
        });
    </script>
</body>
</html>
